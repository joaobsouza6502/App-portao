<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle do Portão</title>
    <!-- Importa a biblioteca MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background-color: #222; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        button { width: 80%; padding: 20px; margin: 20px 0; font-size: 24px; border: none; border-radius: 10px; color: white; cursor: pointer; }
        #btnAbrir { background-color: #4CAF50; }
        #btnFechar { background-color: #f44336; }
        #btnLuz { background-color: #333; color: white; border: 1px solid #555; } /* Cor inicial apagada */
        #status { margin-top: 30px; font-size: 18px; color: #FFC107; }
    </style>
</head>
<body>

    <h1>Portão LoRa</h1>
    
    <button id="btnAbrir" onclick="enviarComando('OPEN')">ABRIR</button>
    <button id="btnFechar" onclick="enviarComando('CLOSE')">FECHAR</button>
    <!-- BOTÃO DA LUZ ADICIONADO AQUI -->
    <button id="btnLuz" onclick="toggleLuz()">LUZ APAGADA</button>
    
    <div id="status">Desconectado</div>

    <script>
        // ⚠️ TROQUE OS DADOS ABAIXO PELOS SEUS
        const brokerUrl = "ws://192.168.1.100:9001"; 
	const username = "portao-usuario";
	const password = "Portao2026";

        let client;
        let luzLigada = false; // Movido para o topo para evitar erros no JavaScript

        function conectar() {
            document.getElementById("status").innerText = "Conectando...";
            
            // Conecta no EMQX via WebSocket
            client = mqtt.connect(brokerUrl, {
                username: username,
                password: password,
                clientId: "app_celular_" + Math.random().toString(16).substr(2, 8)
            });

            client.on("connect", function () {
                document.getElementById("status").innerText = "Conectado!";
                document.getElementById("status").style.color = "#4CAF50";
                
                // Inscreve nos tópicos
                client.subscribe("portao/status");
                client.subscribe("portao/evento"); 
            });

            client.on("message", function (topic, message) {
                let msg = message.toString();

                // Verifica se é a mensagem de status normal
                if (topic === "portao/status") {
                    document.getElementById("status").innerText = "Status: " + msg;

                    // Sincroniza o botão físico com a nuvem
                    if (msg.includes("LIGHT_ON") && !luzLigada) {
                        luzLigada = true;
                        atualizarBotaoLuz();
                    } else if (msg.includes("LIGHT_OFF") && luzLigada) {
                        luzLigada = false;
                        atualizarBotaoLuz();
                    }
                }

                // Alerta de movimento
                if (topic === "portao/evento" && msg.includes("INFO: Luz ligada")) {
                    // Opcional: você pode colocar um som discreto aqui
                }

                // Alerta do radar externo
                if (topic === "portao/evento" && msg.includes("ALERTA")) {
                    if (navigator.vibrate) {
                        navigator.vibrate([500, 200, 500, 200, 500]); 
                    }
                    alert("⚠️ " + msg); 
                }
            });

            client.on("error", function (err) {
                document.getElementById("status").innerText = "Erro de conexão";
                document.getElementById("status").style.color = "#f44336";
            });
        }

        function enviarComando(cmd) {
            if (client && client.connected) {
                client.publish("portao/comando", cmd);
                document.getElementById("status").innerText = "Enviando: " + cmd + "...";
            } else {
                alert("Não está conectado ao broker!");
            }
        }

        function toggleLuz() {
            if (client && client.connected) {
                let cmd = luzLigada ? "LIGHT_OFF" : "LIGHT_ON";
                client.publish("portao/comando", cmd);
                
                // Atualização otimista na tela (muda antes de receber a confirmação)
                luzLigada = !luzLigada;
                atualizarBotaoLuz();
            } else {
                alert("Não está conectado!");
            }
        }

        function atualizarBotaoLuz() {
            let btn = document.getElementById("btnLuz");
            if (luzLigada) {
                btn.style.backgroundColor = "#FFC107"; // Amarelo brilhante
                btn.style.color = "black";
                btn.innerText = "LUZ ACESA";
            } else {
                btn.style.backgroundColor = "#333"; // Cinza escuro
                btn.style.color = "white";
                btn.innerText = "LUZ APAGADA";
            }
        }

        // Inicia a conexão assim que a tela abre
        conectar();
    </script>
</body>
</html>
